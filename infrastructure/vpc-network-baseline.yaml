AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Small VPC learning baseline with one internet-routed subnet, one isolated
  subnet, required course tags, and no hourly network appliances.

Parameters:
  CourseTag:
    Type: String
    Default: aws-solutions-architect
    MinLength: 1
    MaxLength: 128
    Description: Value for the required Course tag.
  ModuleTag:
    Type: String
    Default: shared-tooling
    MinLength: 1
    MaxLength: 128
    Description: Value for the required Module tag.
  OwnerTag:
    Type: String
    MinLength: 2
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._@+-]{1,63}$'
    ConstraintDescription: Use 2-64 ASCII letters, numbers, or . _ @ + -.
    Description: Non-sensitive learner or team identifier for the Owner tag.
  ExpiresAtTag:
    Type: String
    AllowedPattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    ConstraintDescription: Use an ISO date in YYYY-MM-DD format.
    Description: Review date for the ExpiresAt tag; it does not delete resources.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/(1[6-9]|2[0-8])$'
    ConstraintDescription: Use an IPv4 CIDR with a prefix from /16 through /28.
    Description: IPv4 CIDR for the VPC.
  PublicSubnetCidr:
    Type: String
    Default: 10.42.0.0/24
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/(1[6-9]|2[0-8])$'
    ConstraintDescription: Use an IPv4 CIDR with a prefix from /16 through /28.
    Description: CIDR inside VpcCidr for the internet-routed subnet.
  PrivateSubnetCidr:
    Type: String
    Default: 10.42.1.0/24
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/(1[6-9]|2[0-8])$'
    ConstraintDescription: Use an IPv4 CIDR with a prefix from /16 through /28.
    Description: Non-overlapping CIDR inside VpcCidr for the isolated subnet.

Resources:
  LearningVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
        - Key: Course
          Value: !Ref CourseTag
        - Key: Module
          Value: !Ref ModuleTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAtTag
        - Key: CostLabel
          Value: FREE-PLAN SAFE

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'
        - Key: Course
          Value: !Ref CourseTag
        - Key: Module
          Value: !Ref ModuleTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAtTag
        - Key: CostLabel
          Value: FREE-PLAN SAFE

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref LearningVpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref LearningVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-a'
        - Key: Course
          Value: !Ref CourseTag
        - Key: Module
          Value: !Ref ModuleTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAtTag
        - Key: CostLabel
          Value: FREE-PLAN SAFE

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref LearningVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-a'
        - Key: Course
          Value: !Ref CourseTag
        - Key: Module
          Value: !Ref ModuleTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAtTag
        - Key: CostLabel
          Value: FREE-PLAN SAFE

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LearningVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'
        - Key: Course
          Value: !Ref CourseTag
        - Key: Module
          Value: !Ref ModuleTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAtTag
        - Key: CostLabel
          Value: FREE-PLAN SAFE

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LearningVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'
        - Key: Course
          Value: !Ref CourseTag
        - Key: Module
          Value: !Ref ModuleTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: ExpiresAt
          Value: !Ref ExpiresAtTag
        - Key: CostLabel
          Value: FREE-PLAN SAFE

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet

Outputs:
  VpcId:
    Description: ID of the learning VPC.
    Value: !Ref LearningVpc
  VpcCidr:
    Description: IPv4 CIDR assigned to the learning VPC.
    Value: !GetAtt LearningVpc.CidrBlock
  AvailabilityZone:
    Description: Availability Zone used by both learning subnets.
    Value: !GetAtt PublicSubnet.AvailabilityZone
  PublicSubnetId:
    Description: Subnet with an internet gateway route and public IP assignment disabled.
    Value: !Ref PublicSubnet
  PrivateSubnetId:
    Description: Subnet with only the implicit local VPC route.
    Value: !Ref PrivateSubnet
  PublicRouteTableId:
    Description: Route table containing the internet gateway route.
    Value: !Ref PublicRouteTable
  PrivateRouteTableId:
    Description: Route table containing no internet route.
    Value: !Ref PrivateRouteTable
  InternetGatewayId:
    Description: ID of the attached internet gateway.
    Value: !Ref InternetGateway
  NatGatewayCount:
    Description: NAT gateways intentionally created by this template.
    Value: '0'
  StackRegion:
    Description: Region in which this stack was created.
    Value: !Ref AWS::Region
